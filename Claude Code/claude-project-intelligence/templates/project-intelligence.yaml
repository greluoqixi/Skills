schema_version: "1.0"
exclude: []
limits:
  max_file_bytes: 2000000
  root_index_bytes: 10000
  root_index_lines: 200
  module_card_bytes: 8000
  module_candidate_limit: 5
  bug_candidate_limit: 5
  bug_full_read_limit: 2
modules:
  target_min_files: 20
  target_max_files: 200
  split_file_threshold: 300
  max_key_files: 15
  max_children: 10
